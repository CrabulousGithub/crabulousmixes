<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Mixes</title><link rel="stylesheet" href="style.css">
<style>.gate{max-width:380px;margin:20px auto}.gate .lead{text-align:center;margin-bottom:18px}.gate .status{margin-top:14px}</style></head>
<body>
<main class="win">
  <div class="bar"><h1>Mixes</h1><div class="btns" aria-hidden="true"><i></i><i></i><i></i></div></div>
  <div class="pane">
    <p class="empty" id="load">Loading…</p>
    <form class="gate" id="gate" hidden>
      <p class="lead">Enter the passcode to see the mixes.</p>
      <div class="group"><label><span>Passcode</span><input id="pw" type="password" autocomplete="current-password" required></label></div>
      <button class="btn" id="unlock">Unlock</button>
      <p class="status err" id="err" role="alert" hidden></p>
    </form>
    <div id="lib" hidden>
      <p class="lead">Custom mixes. Tap Download to open the Mega link.</p>
      <div class="shelf" id="shelf"></div>
    </div>
  </div>
</main>
<script>
/* Passcode encryption: PBKDF2 (SHA-256) -> AES-GCM. Used by index.html and admin.html. */
const Vault=(()=>{
  const te=new TextEncoder(),td=new TextDecoder(),ITER=310000;
  const b64=u=>{let s='';new Uint8Array(u).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function key(p,salt){
    const k=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  return{
    async seal(list,p){
      if(!(globalThis.crypto&&crypto.subtle))throw new Error('Encryption is blocked when a page is opened from a file on some browsers. Run python3 -m http.server in this folder and open http://localhost:8000/admin.html, or use your GitHub Pages address.');
      const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(p,salt),te.encode(JSON.stringify(list)));
      return{v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)};
    },
    async open(env,p){
      if(!(globalThis.crypto&&crypto.subtle))throw new Error('Encryption is blocked when a page is opened from a file on some browsers. Run python3 -m http.server in this folder and open http://localhost:8000/admin.html, or use your GitHub Pages address.');
      try{
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},await key(p,unb64(env.salt)),unb64(env.data));
        return JSON.parse(td.decode(pt));
      }catch(e){throw new Error('Wrong passcode.')}
    }
  };
})();
</script>
<script>
const $=id=>document.getElementById(id),shelf=$('shelf');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const safe=u=>/^https:\/\/mega\.(nz|io)\//.test(u);
let env;
function render(list){
  $('load').hidden=true;$('gate').hidden=true;$('lib').hidden=false;shelf.textContent='';
  if(!list.length){shelf.append(el('p','empty','No mixes yet. Add the first one from admin.html.'));return}
  list.sort((a,b)=>b.date.localeCompare(a.date)).forEach(m=>{
    const card=el('article'),box=el('div','case'),a=el('a','cover');
    a.href=safe(m.mega)?m.mega:'#';a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','Download '+m.title);
    const img=new Image();img.alt='Cover art for '+m.title;img.loading='lazy';img.src=m.cover;
    img.onerror=()=>img.replaceWith(el('div','ph'));
    a.append(img);box.append(a);
    const meta=el('div','meta'),t=el('time');
    t.dateTime=m.date;t.textContent=new Date(m.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
    const b=el('a','btn','Download');b.href=a.href;b.target='_blank';b.rel='noopener noreferrer';
    meta.append(el('h2','',m.title),t,b);card.append(box,meta);shelf.append(card);
  });
}
async function unlock(p){const list=await Vault.open(env,p);sessionStorage.setItem('mixpw',p);render(list)}
$('gate').onsubmit=async e=>{
  e.preventDefault();$('err').hidden=true;$('unlock').disabled=true;$('unlock').textContent='Unlocking…';
  try{await unlock($('pw').value)}
  catch(x){$('err').textContent='Wrong passcode. Try again.';$('err').hidden=false;$('pw').value='';$('pw').focus()}
  $('unlock').disabled=false;$('unlock').textContent='Unlock';
};
fetch('mixes.json?'+Date.now()).then(r=>r.json()).then(async d=>{
  if(Array.isArray(d))return render(d);
  env=d;const p=sessionStorage.getItem('mixpw');
  if(p){try{return await unlock(p)}catch(x){sessionStorage.removeItem('mixpw')}}
  $('load').hidden=true;$('gate').hidden=false;$('pw').focus();
}).catch(()=>{$('load').textContent='Couldn’t load mixes.json. Check that the file exists and that the page is served over https.'});
</script></body></html>
